- name: Configure web server
  hosts: web
  become: true

  vars:
    secrets: >-
      {{ lookup('ansible.builtin.pipe',
      'aws secretsmanager get-secret-value
      --secret-id task4/oauth2
      --region us-east-1
      --query SecretString
      --output text') | from_json }}

  tasks:
    - name: Configure Keycloak environment
      ansible.builtin.template:
        src: keycloak.env.j2
        dest: /etc/keycloak.env
        mode: "0600"
      no_log: true
      notify: Restart Keycloak
      tags: keycloak_setup

    - name: Install Keycloak service
      ansible.builtin.copy:
        src: keycloak.service
        dest: /etc/systemd/system/keycloak.service
        mode: "0644"
      notify: Restart Keycloak
      tags: keycloak_setup

    - name: Start Keycloak
      ansible.builtin.systemd_service:
        name: keycloak
        state: started
        enabled: true
        daemon_reload: true
      tags: keycloak_setup

    - name: Configure Nginx
      ansible.builtin.copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf
        mode: "0644"
      notify: Reload Nginx
      tags: keycloak_setup

    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
      tags: keycloak_setup

    - name: Configure OAuth2 Proxy
      ansible.builtin.template:
        src: oauth2-proxy.cfg.j2
        dest: /etc/oauth2-proxy.cfg
        mode: "0600"
      no_log: true
      notify: Restart OAuth2 Proxy

    - name: Install OAuth2 Proxy service
      ansible.builtin.copy:
        src: oauth2-proxy.service
        dest: /etc/systemd/system/oauth2-proxy.service
        mode: "0644"
      notify: Restart OAuth2 Proxy

    - name: Start OAuth2 Proxy
      ansible.builtin.systemd_service:
        name: oauth2-proxy
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart Keycloak
      ansible.builtin.service:
        name: keycloak
        state: restarted

    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Restart OAuth2 Proxy
      ansible.builtin.service:
        name: oauth2-proxy
        state: restarted
