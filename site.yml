- name: Configure web server
  hosts: web
  become: true

  vars:
    secrets: "{{ lookup('ansible.builtin.env', 'OAUTH2_SECRETS') | from_json }}"

  tasks:
    - name: Configure Keycloak environment
      ansible.builtin.template:
        src: keycloak.env.j2
        dest: /etc/keycloak.env
        mode: "0600"
      no_log: true
      notify: Restart Keycloak

    - name: Install Keycloak service
      ansible.builtin.copy:
        src: keycloak.service
        dest: /etc/systemd/system/keycloak.service
      notify: Restart Keycloak

    - name: Start Keycloak
      ansible.builtin.systemd_service:
        name: keycloak
        state: started
        enabled: true
        daemon_reload: true

    - name: Configure Nginx
      ansible.builtin.copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf
      notify: Reload Nginx

    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Apply Keycloak and Nginx changes
      ansible.builtin.meta: flush_handlers

    - name: Wait for Keycloak
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/auth/realms/master/.well-known/openid-configuration
      register: keycloak_ready
      until: keycloak_ready.status | default(0) == 200
      retries: 30
      delay: 2

    - name: Get Keycloak admin token
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/auth/realms/master/protocol/openid-connect/token
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: admin-cli
          username: admin
          password: "{{ secrets.keycloak_admin_password }}"
      register: keycloak_token
      no_log: true

    - name: Check task4 realm
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/auth/admin/realms/task4
        headers:
          Authorization: "Bearer {{ keycloak_token.json.access_token }}"
        status_code: [200, 404]
      register: task4_realm
      no_log: true

    - name: Create task4 realm
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/auth/admin/realms
        method: POST
        headers:
          Authorization: "Bearer {{ keycloak_token.json.access_token }}"
        body_format: json
        body:
          realm: task4
          enabled: true
        status_code: 201
      when: task4_realm.status == 404
      no_log: true

    - name: Check task4-web client
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/auth/admin/realms/task4/clients?clientId=task4-web
        headers:
          Authorization: "Bearer {{ keycloak_token.json.access_token }}"
      register: task4_clients
      no_log: true

    - name: Create task4-web client
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/auth/admin/realms/task4/clients
        method: POST
        headers:
          Authorization: "Bearer {{ keycloak_token.json.access_token }}"
        body_format: json
        body:
          clientId: task4-web
          enabled: true
          protocol: openid-connect
          publicClient: false
          standardFlowEnabled: true
          secret: "{{ secrets.keycloak_client_secret }}"
          redirectUris:
            - https://isopenkoandrii.pp.ua/oauth2/callback
        status_code: 201
      when: task4_clients.json | length == 0
      no_log: true

    - name: Check GitLab provider
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/auth/admin/realms/task4/identity-provider/instances/gitlab
        headers:
          Authorization: "Bearer {{ keycloak_token.json.access_token }}"
        status_code: [200, 404]
      register: gitlab_provider
      no_log: true

    - name: Create GitLab provider
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/auth/admin/realms/task4/identity-provider/instances
        method: POST
        headers:
          Authorization: "Bearer {{ keycloak_token.json.access_token }}"
        body_format: json
        body:
          alias: gitlab
          providerId: gitlab
          enabled: true
          trustEmail: true
          config:
            clientId: "{{ secrets.gitlab_client_id }}"
            clientSecret: "{{ secrets.gitlab_client_secret }}"
            syncMode: FORCE
        status_code: 201
      when: gitlab_provider.status == 404
      no_log: true

    - name: Update GitLab provider
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/auth/admin/realms/task4/identity-provider/instances/gitlab
        method: PUT
        headers:
          Authorization: "Bearer {{ keycloak_token.json.access_token }}"
        body_format: json
        body:
          alias: gitlab
          providerId: gitlab
          enabled: true
          trustEmail: true
          config: "{{ gitlab_provider.json.config | combine({'clientId': secrets.gitlab_client_id, 'clientSecret': secrets.gitlab_client_secret, 'syncMode': 'FORCE'}) }}"
        status_code: 204
      when:
        - gitlab_provider.status == 200
        - not (gitlab_provider.json.trustEmail | default(false) | bool) or
          (gitlab_provider.json.config.syncMode | default('')) != 'FORCE'
      no_log: true

    - name: Get browser flow
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/auth/admin/realms/task4/authentication/flows/browser/executions
        headers:
          Authorization: "Bearer {{ keycloak_token.json.access_token }}"
      register: browser_flow
      no_log: true

    - name: Set GitLab as default provider
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/auth/admin/realms/task4/authentication/executions/{{ redirector.id }}/config"
        method: POST
        headers:
          Authorization: "Bearer {{ keycloak_token.json.access_token }}"
        body_format: json
        body:
          alias: gitlab-default
          config:
            defaultProvider: gitlab
        status_code: 201
      vars:
        redirector: "{{ browser_flow.json | selectattr('providerId', 'defined') | selectattr('providerId', 'equalto', 'identity-provider-redirector') | first }}"
      when: redirector.authenticationConfig | default('', true) == ''
      no_log: true

    - name: Configure OAuth2 Proxy
      ansible.builtin.template:
        src: oauth2-proxy.cfg.j2
        dest: /etc/oauth2-proxy.cfg
        mode: "0600"
      no_log: true
      notify: Restart OAuth2 Proxy

    - name: Install OAuth2 Proxy service
      ansible.builtin.copy:
        src: oauth2-proxy.service
        dest: /etc/systemd/system/oauth2-proxy.service
      notify: Restart OAuth2 Proxy

    - name: Start OAuth2 Proxy
      ansible.builtin.systemd_service:
        name: oauth2-proxy
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart Keycloak
      ansible.builtin.service:
        name: keycloak
        state: restarted

    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Restart OAuth2 Proxy
      ansible.builtin.service:
        name: oauth2-proxy
        state: restarted
